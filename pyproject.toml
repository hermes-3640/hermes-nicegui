[project]
name = "hermes-nicegui"
version = "0.1.0"
description = "Modular plugin-based NiceGUI web UI for the Hermes Agent gateway"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nicegui>=3.0,<4",
    "httpx>=0.27",
    "loguru>=0.7",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
hermes-nicegui = "hermes_nicegui.app:main"

[project.entry-points."hermes_nicegui.plugins"]
sessions = "hermes_nicegui.plugins.sessions:SessionsPlugin"
cron = "hermes_nicegui.plugins.cron:CronPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_nicegui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# No main.py dependency: pages are registered by hermes_nicegui.web.build(),
# which each test calls explicitly with the plugin set it wants to exercise.
main_file = ""
addopts = "-p nicegui.testing.user_plugin"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.411",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
